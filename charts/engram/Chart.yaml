apiVersion: v2
name: engram
description: A Helm chart for Engram Cloud — AI-powered persistent memory server for LLM agents
type: application
version: 3.5.0
appVersion: v3.4.0
home: https://github.com/Gentleman-Programming/engram
sources:
  - https://github.com/Gentleman-Programming/engram
  - https://github.com/devops-ia/helm-engram
maintainers:
  - name: amartingarcia
    email: adrianmg231189@gmail.com
  - name: ialejandro
    email: hello@ialejandro.rocks
keywords:
  - engram
  - ai
  - memory
  - llm
  - mcp
  - agent
  - golang
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: ai-ml
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/changes: |
    - kind: fixed
      description: "Fail-fast validation moved to templates/validate.yaml so it also runs with helm template (ArgoCD, Flux, helmfile)"
    - kind: fixed
      description: "NetworkPolicy egress to bundled PostgreSQL now matches the StatefulSet pod labels"
    - kind: fixed
      description: "NOTES.txt health check URL (/health instead of /healthz)"
    - kind: added
      description: "Validation for missing PostgreSQL connection and missing bundled PostgreSQL password"
    - kind: added
      description: "engram.tokenPepper (ENGRAM_CLOUD_TOKEN_PEPPER) for managed-token authentication"
    - kind: added
      description: "engram.maxPushBytes (ENGRAM_CLOUD_MAX_PUSH_BYTES)"
    - kind: added
      description: "checksum/config and checksum/postgresql pod annotations to roll pods on config changes"
    - kind: added
      description: "Configurable wait-for-postgresql init container image and resources"
    - kind: added
      description: "postgresql.auth.existingSecret support; DSN built in-pod without duplicating the password"
    - kind: added
      description: "networkPolicy.extraIngress / extraEgress (e.g. AWS ALB target-type ip)"
    - kind: changed
      description: "BREAKING: postgresql.auth.password has no default; set it or postgresql.auth.existingSecret"
